schema_version = "1.0.0"

id = "unreal_mhx"
version = "1.0.0"
name = "Unreal MHX"
tagline = "Export Diffeomorphic MHX characters as UE5 Mannequin skeletons"
maintainer = "Kyle Austad"
type = "add-on"
tags = ["Import-Export", "Animation", "Rigging"]
